<div style="width: 1080px; height: 1080px; box-sizing: border-box; background: #101013; color: #f4f1ea; padding: 90px; display: flex; flex-direction: column;">

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; text-align: left; gap: 40px;">
    <h1 style="margin: 0; font-weight: 700; font-size: 60px; line-height: 1.05; letter-spacing: -0.04em; max-width: 21ch;">Compras el sistema completo. El paciente sigue sin volver a su segunda sesión.</h1>
    <div style="width: 760px; border: 2px solid rgba(244,241,234,.22); border-radius: 16px; overflow: hidden;"><div style="display: flex; gap: 10px; padding: 17px 22px; border-bottom: 2px solid rgba(244,241,234,.22);"><span style="width:13px;height:13px;border-radius:99px;background:rgba(244,241,234,.50);"></span><span style="width:13px;height:13px;border-radius:99px;background:rgba(244,241,234,.50);"></span><span style="width:13px;height:13px;border-radius:99px;background:rgba(244,241,234,.50);"></span></div><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 22px;"><div style=" border: 2px solid rgba(244,241,234,.22); border-radius: 10px; padding: 15px 20px; font-family: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 23px; color: rgba(244,241,234,.55);">agenda</div><div style=" border: 2px solid rgba(244,241,234,.22); border-radius: 10px; padding: 15px 20px; font-family: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 23px; color: rgba(244,241,234,.55);">expediente</div><div style=" border: 2px solid rgba(244,241,234,.22); border-radius: 10px; padding: 15px 20px; font-family: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 23px; color: rgba(244,241,234,.55);">facturación</div><div style=" border: 2px solid rgba(244,241,234,.22); border-radius: 10px; padding: 15px 20px; font-family: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 23px; color: rgba(244,241,234,.55);">inventario</div><div style="grid-column: 1 / -1; border: 2px solid #7ad0c6; border-radius: 10px; padding: 15px 20px; font-family: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 23px; color: #7ad0c6;">reagendado</div></div></div>
  </div>
